name: CI

# Chạy test + build trên mọi push/PR vào main. Mục đích: người lạ vào repo thấy được
# "code này có tự kiểm tra", và bản thân mình không push nhầm bản build hỏng lên Pages
# (Cloudflare auto-deploy từ main — hỏng là hỏng thẳng trên production).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (roundHint + sync API)
        run: npm test
      - name: Production build
        run: npm run build
