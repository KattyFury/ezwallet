<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EZwallet – a crypto wallet simple enough for my mom to use</title>

    <!-- SEO + LINK PREVIEW CARDS (2026-07-29). The page used to have NO meta tags at all →
         pasting ezwallet.cash into X/Telegram/Facebook produced an empty box, no image and no text.
         ⚠️ og:image MUST be an ABSOLUTE URL (a /og.png path does not work) and the image must open
         WITHOUT a login. When changing the image, remember X/Facebook cache it - use their debug tools
         to force a re-scan, or rename the file.
         ⚠️ BRAND VOICE: the official slogan is "A crypto wallet simple enough for my mom to use."
         and ONLY en dashes (U+2013) may be used, NEVER em dashes (U+2014), in anything a reader sees. -->
    <meta name="description" content="Send and receive stablecoins with just an email and a 6-digit PIN. No seed phrase, no separate gas token – USDC pays its own fees on Arc. Running on Arc Testnet." />
    <link rel="canonical" href="https://ezwallet.cash/" />
    <meta name="theme-color" content="#0B53BF" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EZwallet" />
    <meta property="og:url" content="https://ezwallet.cash/" />
    <meta property="og:title" content="EZwallet – a crypto wallet simple enough for my mom to use" />
    <meta property="og:description" content="Email + PIN, no seed phrase. USDC pays its own gas on Arc. Swap by dragging a slider. Live on Arc Testnet." />
    <meta property="og:image" content="https://ezwallet.cash/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EZwallet – email + PIN crypto wallet on Arc" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@0xhieuxyz" />
    <meta name="twitter:title" content="EZwallet – a crypto wallet simple enough for my mom to use" />
    <meta name="twitter:description" content="Email + PIN, no seed phrase. USDC pays its own gas on Arc. Swap by dragging a slider. Live on Arc Testnet." />
    <meta name="twitter:image" content="https://ezwallet.cash/og.png?v=2" />

    <!-- NO WEBFONT (user decision 2026-08-30). The app uses the system stack - see the FONT note at
         the top of src/index.css. This is where Barlow, and briefly Inter, used to be loaded from
         Google Fonts, along with two preconnects to fonts.googleapis.com and fonts.gstatic.com.
         All of it is gone on purpose: it was a third-party request in front of the first paint, on an
         app whose whole point is opening fast on a cheap phone. Do not add it back without a reason. -->
    <link rel="icon" type="image/png" href="/fav_icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EZwallet" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
