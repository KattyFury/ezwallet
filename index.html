<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EZwallet – a crypto wallet simple enough for my mom to use</title>

    <!-- SEO + LINK PREVIEW CARDS (2026-07-29). The page used to have NO meta tags at all →
         pasting ezwallet.cash into X/Telegram/Facebook produced an empty box, no image and no text.
         ⚠️ og:image MUST be an ABSOLUTE URL (a /og.png path does not work) and the image must open
         WITHOUT a login. When changing the image, remember X/Facebook cache it - use their debug tools
         to force a re-scan, or rename the file.
         ⚠️ BRAND VOICE: the official slogan is "A crypto wallet simple enough for my mom to use."
         and ONLY en dashes (U+2013) may be used, NEVER em dashes (U+2014), in anything a reader sees. -->
    <meta name="description" content="Send and receive stablecoins with just an email and a 6-digit PIN. No seed phrase, no separate gas token – USDC pays its own fees on Arc. Running on Arc Testnet." />
    <link rel="canonical" href="https://ezwallet.cash/" />
    <meta name="theme-color" content="#0B53BF" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EZwallet" />
    <meta property="og:url" content="https://ezwallet.cash/" />
    <meta property="og:title" content="EZwallet – a crypto wallet simple enough for my mom to use" />
    <meta property="og:description" content="Email + PIN, no seed phrase. USDC pays its own gas on Arc. Swap by dragging a slider. Live on Arc Testnet." />
    <meta property="og:image" content="https://ezwallet.cash/og.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EZwallet – email + PIN crypto wallet on Arc" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@0xhieuxyz" />
    <meta name="twitter:title" content="EZwallet – a crypto wallet simple enough for my mom to use" />
    <meta name="twitter:description" content="Email + PIN, no seed phrase. USDC pays its own gas on Arc. Swap by dragging a slider. Live on Arc Testnet." />
    <meta name="twitter:image" content="https://ezwallet.cash/og.png?v=3" />

    <!-- NO WEBFONT (2026-09-07, brand guideline: system font stack only). This is where Barlow used to
         load from Google Fonts, along with 2 preconnects to fonts.googleapis.com/fonts.gstatic.com -
         all gone on purpose: it was a third-party request in front of first paint on an app whose whole
         point is opening fast on a cheap phone. See the FONT section at the top of src/index.css. -->
    <!-- SVG FIRST, PNG SECOND (2026-09-11, THIRD icon revision - source design/new-brand/icon.svg,
         supplied by the user, replacing the "apple.svg" version from earlier the same day). Same EZ
         artwork again, re-exported with no background rect at all (fully transparent, vs. that version's
         explicit white square) - even more full-bleed. icon.png/fav_icon.png are rasterised FROM this
         same icon.svg at 512x512 with a WHITE background painted in during rasterisation (iOS handles
         transparency in apple-touch-icon poorly - the SVG itself stays transparent, only the PNG gets a
         fill). `?v=4` busts the cache - favicons/touch icons are cached hard and long, without it the
         change looks like it never shipped. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=4" />
    <link rel="icon" type="image/png" href="/fav_icon.png?v=4" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EZwallet" />
    <link rel="apple-touch-icon" href="/icon.png?v=4" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
